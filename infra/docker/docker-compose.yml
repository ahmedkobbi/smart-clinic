# Smart Clinic — On-Premise Docker Compose
# Per master prompt §8.3: "Clinic-in-a-Box"
# Single `docker compose up` for a solo cabinet

version: '3.8'

services:
  # Smart Clinic Application
  app:
    image: smartclinic/app:latest
    container_name: smartclinic-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://smartclinic:smartclinic@db:5432/smartclinic
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NODE_ENV=production
      - DEPLOYMENT_MODE=on-prem
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/app/data
      - app-keys:/app/.keys
    networks:
      - smartclinic-net

  # PostgreSQL with RLS + pgvector
  db:
    image: postgres:16-alpine
    container_name: smartclinic-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=smartclinic
      - POSTGRES_PASSWORD=smartclinic
      - POSTGRES_DB=smartclinic
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartclinic"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartclinic-net

  # Valkey (Redis-compatible, BSD-3 licensed)
  cache:
    image: valkey/valkey:7-alpine
    container_name: smartclinic-cache
    restart: unless-stopped
    command: valkey-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - cache-data:/data
    networks:
      - smartclinic-net

  # MinIO (S3-compatible object storage for documents/imaging)
  minio:
    image: minio/minio:latest
    container_name: smartclinic-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=smartclinic
      - MINIO_ROOT_PASSWORD=smartclinic-secret
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - smartclinic-net

  # Caddy reverse proxy (automatic HTTPS)
  proxy:
    image: caddy:2-alpine
    container_name: smartclinic-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - smartclinic-net

volumes:
  app-data:
  app-keys:
  db-data:
  cache-data:
  minio-data:
  caddy-data:
  caddy-config:

networks:
  smartclinic-net:
    driver: bridge
